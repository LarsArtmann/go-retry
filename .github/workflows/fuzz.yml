name: Fuzz

on:
  schedule:
    # Daily at 03:17 UTC; scheduled workflows run on the default branch only.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz FuzzComputeDelayNeverPanics (30 minutes)
        run: go test -run '^$' -fuzz '^FuzzComputeDelayNeverPanics$' -fuzztime 30m -fuzzminimizetime 5m .
      - name: Upload crash corpus on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          namee: fuzz-crash-corpus-${{ github.sha }}
          path: testdata/fuzz/
          if-no-files-found: ignore
