name: Fuzz

on:
  schedule:
    # Daily at 03:17 UTC; scheduled workflows run on the default branch only.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz FuzzComputeDelayNeverPanics (30 minutes)
        run: go test -run '^$' -fuzz '^FuzzComputeDelayNeverPanics$' -fuzztime 30m .
      - name: Upload crash corpus on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crash-corpus
          path: testdata/fuzz/
          if-no-files-found: ignore
